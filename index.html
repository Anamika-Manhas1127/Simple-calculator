<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="calculator" aria-label="Calculator">
        <input type="text" id="display" value="0" aria-label="Calculator display" aria-live="polite" readonly>
        <div class="buttons" aria-label="Calculator keys">
            <button type="button" class="utility" data-action="clear">AC</button>
            <button type="button" class="utility" data-action="backspace" aria-label="Backspace">⌫</button>
            <button type="button" class="utility" data-action="percent">%</button>
            <button type="button" class="operator" data-value="/" aria-label="Divide">÷</button>
            <button type="button" data-value="7">7</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="9">9</button>
            <button type="button" class="operator" data-value="*" aria-label="Multiply">×</button>
            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="6">6</button>
            <button type="button" class="operator" data-value="-" aria-label="Subtract">−</button>
            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" class="operator" data-value="+" aria-label="Add">+</button>
            <button type="button" class="utility" data-action="sign" aria-label="Change sign">±</button>
            <button type="button" data-value="0">0</button>
            <button type="button" data-action="decimal">.</button>
            <button type="button" class="equals" data-action="equals">=</button>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
